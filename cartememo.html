<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KarteMemo へ移動します</title>
<meta name="robots" content="noindex">
<script>
// 旧アドレス（cartememo.html）に来た場合の転送。
// ブックマーク・ブックマークレット・ショートカットをそのまま使えるように、
// ?electronic_amount=... などのパラメータを引き継いで新しいアドレスへ移す
(function(){
  try { location.replace('kartememo.html' + location.search + location.hash); }
  catch(e) { location.href = 'kartememo.html' + location.search + location.hash; }
})();
</script>
<meta http-equiv="refresh" content="1;url=kartememo.html">
<style>
body{margin:0;padding:40px 20px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
     background:#faf9f7;color:#1a1a1a;text-align:center;line-height:1.7}
a{color:#1a4b8a;font-weight:700}
</style>
</head>
<body>
<p>KarteMemo は <b>kartememo.html</b> に移動しました。</p>
<p>自動で移動します。切り替わらない場合は <a id="go" href="kartememo.html">こちらを開いてください</a>。</p>
<p style="font-size:13px;color:#666">ブックマークを新しいアドレスに更新しておくと、次からは直接開けます。</p>
<script>
// 手動リンクにもパラメータを引き継ぐ
document.getElementById('go').href = 'kartememo.html' + location.search + location.hash;
</script>
</body>
</html>
